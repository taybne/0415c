<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TAG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        cursor: pointer;
        background: #000;
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
      }

      .entry-screen {
        width: min(100%, 420px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #d79bb8 0%, #ffcce5 100%);
      }

      .entry-logo {
        display: block;
        width: min(82%, 330px);
        height: auto;
        filter: drop-shadow(0 14px 26px rgba(121, 53, 88, 0.2));
        user-select: none;
      }
    </style>
  </head>
  <body aria-label="Enter TAG">
    <main class="entry-screen">
      <img
        class="entry-logo"
        src="/static/media/tag-logo-transparent.png"
        alt="TAG"
        draggable="false"
      />
    </main>
    <script>
      document.addEventListener("click", () => {
        window.location.href = "{{ url_for('enter', next=request.args.get('next')) }}";
      });
    </script>
  </body>
</html>
